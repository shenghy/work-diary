name: work_diary_app
description: "极简工作日记"
publish_to: 'none'
version: 1.0.22+24

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  path: ^1.9.1
  path_provider: ^2.1.6
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.2.0
  web_socket_channel: ^3.0.1
  uuid: ^4.0.0
  window_manager: ^0.4.0
  tray_manager: ^0.2.0
  docs_gee: ^1.5.0
  file_selector: ^1.1.0
  package_info_plus: ^8.0.0
  archive: ^4.0.5
  url_launcher: ^6.3.2
  hotkey_manager: ^0.2.3
  flutter_markdown: ^0.7.7+1
  markdown: ^7.3.1
  ffi: ^2.1.4
  win32: ^5.15.0
  desktop_drop: ^0.8.4
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/about/
    - assets/upgrade/windows_upgrade.ps1
  fonts:
    - family: AlibabaPuHuiTi
      fonts:
        - asset: assets/fonts/AlibabaPuHuiTi-3-55-Regular.ttf
          weight: 400
        - asset: assets/fonts/AlibabaPuHuiTi-3-65-Medium.ttf
          weight: 500
        - asset: assets/fonts/AlibabaPuHuiTi-3-85-Bold.ttf
          weight: 700
